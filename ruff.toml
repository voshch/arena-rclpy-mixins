target-version = "py312"
line-length = 320
src = ["arena_rclpy_mixins"]
extend-exclude = [
    ".venv",
    "**/launch",
    "**/*.launch.py",
    "**/scripts",
    "**/setup.py",
    "**/*.md",
]

[lint]
exclude = [
    "**/tests/**",
    "**/test/**",
]
select = ["E", "F", "W", "I", "UP", "B", "ANN", "PYI"]
ignore = ["E501", "E402", "F841", "E731", "PYI051", "E741", "UP035", "UP046", "UP047"]

[lint.flake8-annotations]
suppress-none-returning = true
mypy-init-return = true
allow-star-arg-any = true

[format]
quote-style = "preserve"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
